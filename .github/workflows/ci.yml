
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  milestone-01:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Verify the frozen environment contract
        run: uv lock --check

      - name: Compile typed source and scripts
        run: uv run --no-sync python -m compileall -q src scripts tests

      - name: Verify the frozen case and generated artifacts
        run: |
          uv run --no-sync python scripts/verify_case.py
          uv run --no-sync python scripts/generate_case.py --check

      - name: Run deterministic tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Enforce public boundary
        run: uv run --no-sync python scripts/scan_public_boundary.py

      - name: Reject generated drift
        run: git diff --exit-code -- case diagrams/rendered
