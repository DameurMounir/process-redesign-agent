<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Three-option trade-off</title><desc id="d">Controlled incremental, balanced parallel-control, and automation-first options converge on a human review before a digest-bound decision.</desc><rect width="1100" height="300" fill="white"/><g font-family="Arial" text-anchor="middle" fill="#0f172a"><g stroke="#334155" stroke-width="2"><rect x="40" y="35" width="240" height="70" rx="12" fill="#f8fafc"/><rect x="40" y="115" width="240" height="70" rx="12" fill="#ecfdf5"/><rect x="40" y="195" width="240" height="70" rx="12" fill="#fff7ed"/><rect x="470" y="105" width="180" height="90" rx="45" fill="#eff6ff"/><rect x="820" y="115" width="220" height="70" rx="12" fill="#f8fafc"/></g><g stroke="#334155" stroke-width="2" fill="none"><path d="M280 70L470 135"/><path d="M280 150H470"/><path d="M280 230L470 165"/><path d="M650 150H820"/></g><text x="160" y="62" font-size="17" font-weight="700">OPT-A</text><text x="160" y="84" font-size="14">low change · partial target</text><text x="160" y="142" font-size="17" font-weight="700">OPT-B</text><text x="160" y="164" font-size="14">balanced · pilot envelope PASS</text><text x="160" y="222" font-size="17" font-weight="700">OPT-C</text><text x="160" y="244" font-size="14">fastest model · envelope EXCEEDS</text><text x="560" y="144" font-size="17" font-weight="700">Human review</text><text x="560" y="166" font-size="14">ranking is advisory</text><text x="930" y="145" font-size="17" font-weight="700">Digest-bound decision</text><text x="930" y="167" font-size="14">select or reject</text></g></svg>
