<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="190" viewBox="0 0 1080 190" role="img" aria-labelledby="t d"><title id="t">Agent authority separation</title><desc id="d">Evidence analysis and scenario ranking lead to advisory explanation. Only a human selection can enter the decision ledger.</desc><rect width="1080" height="190" fill="white"/><g stroke="#334155" stroke-width="2" fill="none"><path d="M150 85H230M390 85H470M630 85H710M860 85H930"/><path d="M785 115L925 150" stroke-dasharray="7 5"/></g><g font-family="Arial" font-size="15" text-anchor="middle" fill="#0f172a"><g fill="#f8fafc" stroke="#334155"><rect x="20" y="50" width="130" height="70" rx="10"/><rect x="230" y="50" width="160" height="70" rx="10"/><rect x="470" y="50" width="160" height="70" rx="10"/><rect x="710" y="50" width="150" height="70" rx="10"/><rect x="930" y="50" width="130" height="70" rx="10"/><rect x="900" y="135" width="160" height="40" rx="10" fill="#ecfdf5"/></g><text x="85" y="90">Evidence</text><text x="310" y="80">Scenario + trade-off</text><text x="310" y="101">engine</text><text x="550" y="80">Advisor</text><text x="550" y="101">explanation only</text><text x="785" y="80">Human</text><text x="785" y="101">selection</text><text x="995" y="90">Decision</text><text x="995" y="158">Authority boundary</text></g></svg>
