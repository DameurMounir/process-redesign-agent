<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Process Redesign Agent context and decision boundary</title>
  <desc id="desc">Synthetic process evidence flows through AI interpretation and deterministic controls to three future options, then pauses for a human process owner.</desc>
  <rect width="1600" height="900" fill="#f7fafc"/>
  <rect x="0" y="0" width="1600" height="80" fill="#122b49"/>
  <text x="70" y="51" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">PROCESS REDESIGN AGENT · CONTEXT AND AUTHORITY BOUNDARY</text>
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="23" fill="#334155">Which future process offers the best measurable trade-off?</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="210" rx="22" ry="22" width="300" height="220" fill="#ffffff" stroke="#3b82d0" stroke-width="4"/>
    <text x="220" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#122b49">SYNTHETIC EVIDENCE</text>
    <text x="105" y="310" font-size="21" fill="#334155">• AS-IS process</text>
    <text x="105" y="347" font-size="21" fill="#334155">• Roles and rules</text>
    <text x="105" y="384" font-size="21" fill="#334155">• 240 process cases</text>

    <path d="M370 320 H455" stroke="#64748b" stroke-width="5" fill="none"/>
    <polygon points="455,320 435,307 435,333" fill="#64748b"/>

    <rect x="455" y="210" rx="22" ry="22" width="300" height="220" fill="#0ea5a6"/>
    <text x="605" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">AI INTERPRETATION</text>
    <text x="490" y="310" font-size="21" fill="#ffffff">• Recognize patterns</text>
    <text x="490" y="347" font-size="21" fill="#ffffff">• Propose alternatives</text>
    <text x="490" y="384" font-size="21" fill="#ffffff">• Explain trade-offs</text>

    <path d="M755 320 H840" stroke="#64748b" stroke-width="5" fill="none"/>
    <polygon points="840,320 820,307 820,333" fill="#64748b"/>

    <rect x="840" y="210" rx="22" ry="22" width="300" height="220" fill="#2f8f5b"/>
    <text x="990" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">DETERMINISTIC CONTROLS</text>
    <text x="875" y="310" font-size="21" fill="#ffffff">• Validate process graph</text>
    <text x="875" y="347" font-size="21" fill="#ffffff">• Calculate exact KPIs</text>
    <text x="875" y="384" font-size="21" fill="#ffffff">• Preserve controls</text>

    <path d="M1140 320 H1225" stroke="#64748b" stroke-width="5" fill="none"/>
    <polygon points="1225,320 1205,307 1205,333" fill="#64748b"/>

    <rect x="1225" y="210" rx="22" ry="22" width="305" height="220" fill="#1d4f87"/>
    <text x="1377" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">HUMAN AUTHORITY</text>
    <text x="1260" y="310" font-size="21" fill="#ffffff">• Accept assumptions</text>
    <text x="1260" y="347" font-size="21" fill="#ffffff">• Select or reject</text>
    <text x="1260" y="384" font-size="21" fill="#ffffff">• Own final design</text>

    <rect x="180" y="535" rx="24" ry="24" width="1240" height="185" fill="#fff7db" stroke="#d89400" stroke-width="4"/>
    <text x="800" y="585" text-anchor="middle" font-size="26" font-weight="700" fill="#7a4b00">FAIL-CLOSED PUBLIC BOUNDARY</text>
    <text x="250" y="635" font-size="22" fill="#5b4a20">No quantified benefit without baseline data and explicit assumptions.</text>
    <text x="250" y="675" font-size="22" fill="#5b4a20">No model-selected target process · no mandatory-control waiver · no live automation · no forecast claim.</text>

    <text x="70" y="825" font-size="20" fill="#64748b">AtlasBridge Services is fictional. Milestone 01 freezes evidence only; it does not recommend a future option.</text>
  </g>
</svg>
